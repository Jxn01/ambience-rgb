# ambience-rgb configuration.
#
# This file describes one specific rig's hardware. It is the shipped fallback so a
# fresh checkout runs without setup -- it is not a template you must match.
#
# Copy to ~/.config/ambience-rgb/config.toml to describe yours; that path wins
# over this one, and $AMBIENCE_RGB_CONFIG wins over both.

[socket]
# How matterlights reaches this daemon. It must match RGB_PUBLISH_SOCKET in
# matterlights' .env -- `ambience-rgb devices` prints the exact value to paste.
#
#   auto   the unix socket on Linux, UDP on Windows (the default)
#   unix   a unix datagram socket at `path`; refused on Windows, which has none
#   udp    UDP on 127.0.0.1:`udp_port`; RGB_PUBLISH_SOCKET=udp://127.0.0.1:<port>
transport = "auto"

# The unix socket. $XDG_RUNTIME_DIR is the right home for it: tmpfs, per-user,
# cleaned up at logout. Not read at all when the transport is UDP.
path = "$XDG_RUNTIME_DIR/ambience-rgb.sock"

# The UDP port, always on 127.0.0.1. Kept below 49152, Windows' dynamic range,
# where Hyper-V and WSL reserve ports at boot. Not read for the unix socket.
udp_port = 45731

[openrgb]
# 127.0.0.1 deliberately. OpenRGB's own default is 0.0.0.0, which puts control
# of this machine's lighting on the LAN for anyone who asks.
host = "127.0.0.1"
port = 6742

# This server can stop driving hardware while still answering perfectly: round
# trips at 0.1 ms, new connections served, every controller reported -- and
# colour writes with no visible effect on any device. The daemon's liveness
# probe cannot detect that, because the server IS live, and reconnecting does
# not help either. Only a restart does.
#
# So after three reconnects inside two minutes the daemon runs this, at most
# once every five minutes. A plain list applies on every platform; a table picks
# by platform (`linux`, `windows`), and a platform with no entry only logs
# loudly instead. Restarting another program is a real side effect: it resets
# every device, including ones held at a static colour.
[openrgb.restart_command]
linux = ["systemctl", "--user", "restart", "ambience-rgb-openrgb.service"]
# Stop, then WAIT for the task to leave "Running", then start. The task's
# policy is IgnoreNew, so a start issued while the stop is still in flight is
# silently dropped and the server simply stays down. The wait is bounded at ten seconds.
windows = [
    "powershell.exe", "-NoProfile", "-NonInteractive", "-Command",
    "Stop-ScheduledTask -TaskName ambience-rgb-openrgb; $n = 0; while ((Get-ScheduledTask -TaskName ambience-rgb-openrgb).State -eq 'Running' -and $n -lt 50) { Start-Sleep -Milliseconds 200; $n++ }; Start-ScheduledTask -TaskName ambience-rgb-openrgb",
]

[rates]
# Per BUS, not global. USB HID devices are happy at the full sync rate; SMBus is
# shared with the sensors that fan control and monitoring read, and hammering it
# is the one genuinely risky thing this program does.
usb_hz = 20.0
smbus_hz = 4.0

[colour]
# These deliberately make the LEDs DIFFER from the bulbs in the numbers, so
# that they match to the eye.
#
# A bulb is a diffuse area source across a room; an LED is a point source at full
# output a metre from your face. Identical chromaticity, very different
# perception: a 6%-saturated pale green reads as tinted on a lamp and as plain
# white on a strip. MatterLights already applies COLOR_BOOST to the bulbs; this
# is a second helping for the harsher medium.
#
# saturation  push each channel away from the mean of the three. 1.0 = off.
# gamma       spread the channels apart. Raises saturation and darkens anything
#             below full -- but NOT a colour already at peak, since 1**g == 1.
saturation = 1.35
gamma = 1.2

# Pull the near and far groups toward each other. 0.0 keeps the engine's
# intent (near = the screen's strongest components, far = its overall mix);
# 1.0 is one colour everywhere. The gap is deliberate, but at full strength
# the board showing cyan while the fans show pink reads as a fault.
group_cohesion = 0.55

[spread]
# How hard each LED is pulled back to its group's single colour.
#
#   1.0  every LED in a group shows one colour -- the original behaviour
#   0.0  the raw palette gradient, ignoring near/far entirely
#
# The engine clusters each frame into a weighted palette of up to four colours
# and then collapses it, because six bulbs cannot show more. The reference rig has a
# 97-LED motherboard header and three 8-LED fan rings; a middling bias puts the
# palette back as a gradient while keeping the near/far split, which is a real
# choice about which hardware lights the screen and which lights the room.
#
# Needs a publisher sending a palette (matterlights payload v2 or later). With
# an older one this silently does nothing, which is the correct fallback.
bias = 0.35

[commander]
# The Corsair Commander Core, driven by our own hidraw driver because neither
# OpenRGB nor liquidctl can. Both the pump ring and the fans read as "far":
# they light the case, not the screen.
enabled = true
pump_group = "far"
fan_group = "far"

[katana_ha]
# The Sound Blaster Katana V2X soundbar's light bar, through Home Assistant's
# sb_katana integration, which owns the soundbar over Bluetooth
# (github.com/Jxn01/ha-katana). Only colours are posted, to
# <url>/api/sb_katana/stream; HA rate-limits, writes them and turns the lights
# off 10 s after the last frame. It lights the desk, not the screen: "far".
#
# The USB serial driver that used to do this ([katana]) was removed; a config
# that still enables it is refused with a pointer here.
#
# What is posted: a colour that has moved (at most rate_hz), an unchanged one
# again every keepalive_seconds (it must stay under HA's 10 s hand-over), and
# black ONCE, then nothing -- so a dark screen or a stop ends with the lights
# off, not lit black.
#
# The token is a Home Assistant long-lived access token, read from
# $AMBIENCE_RGB_HA_TOKEN, or token_file, or else .ha-token at the root of this
# checkout -- gitignored and never committed.
enabled = true
group = "far"
url = "http://192.168.10.2:8123"
rate_hz = 10.0
keepalive_seconds = 5.0
timeout_seconds = 2.0
# token_file = "~/.config/ambience-rgb/ha-token"

# --- devices ---------------------------------------------------------------
# `match` is a case-insensitive SUBSTRING of the OpenRGB controller name, not an
# exact match, because OpenRGB renames devices between versions.

# The monitor's own rear lighting: as near as it gets.
[[devices]]
match = "AW3225QF"
group = "near"
bus = "usb"

[[devices]]
match = "GeForce RTX 5090"
group = "near"
bus = "smbus"

[[devices]]
match = "Dominator Titanium"
group = "near"
bus = "smbus"

# The board is split per ZONE. Its board-surface lighting sits behind the screen
# and reads as near; the addressable headers drive case strips and fans, which
# read as far. This is the one controller where a single group would be wrong.
[[devices]]
match = "ASRock X870E Taichi"
group = "far"
bus = "usb"
zones = { "IO Cover" = "near", "PCB" = "near" }

# Red and green are swapped in TWO places for this board, and the two must
# move together. OpenRGB swaps a zone whenever the board's own table OR its
# settings file says so -- the file can force a swap on, never off -- and with
# that swap on, every one of these five zones shows red as green. The table is
# board state that differs between boots (OpenRGB itself zeroes it on entering
# Direct mode), so the one arrangement that holds everywhere is both halves:
# OpenRGB's swap pinned on for all five (openrgb_rg_swap -- the installers write
# it into OpenRGB.json) and all five swapped back here.
#
# Change one, change the other, and re-run the installer. The board's own bits
# for the headers can read set on one OS and clear on another, so pinning the
# setting true can look like it changed nothing when it was already on.
#
# Verified by sending pure primaries through the daemon's pipeline with both
# keys as below: pure red and pure green each showed as themselves on all five
# zones. Per ZONE, not per device: PCH and the two 12 V RGB headers are left to
# OpenRGB, and none of them has been checked by eye.
zone_channel_order = { "IO Cover" = "GRB", "PCB" = "GRB", "Addressable Header 1" = "GRB", "Addressable Header 2" = "GRB", "Addressable Header 3/Audio" = "GRB" }
openrgb_rg_swap = ["IO Cover", "PCB", "Addressable Header 1", "Addressable Header 2", "Addressable Header 3/Audio"]

[[devices]]
match = "Razer Naga"
group = "far"
bus = "usb"

# Explicitly excluded: the numpad keeps its own white.
#
# `static` sets it once per connection instead of syncing it. Without that,
# "excluded" means nothing ever writes to it -- and OpenRGB's Direct mode does
# not persist, so every restart of the server left this keyboard dark with
# nothing to put it back.
[[devices]]
match = "Keychron"
group = "excluded"
bus = "usb"
static = "#ffffff"
