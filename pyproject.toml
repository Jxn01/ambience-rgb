[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambience-rgb"
version = "1.0.0"
description = "Ambient screen-to-light sync for the RGB hardware inside your case"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
# The hid binding follows OPPOSITE rules on the two platforms; both are held by
# tests/test_packaging.py.
#
# Linux: it comes from the SYSTEM python-hidapi (cython-hidapi), NOT from PyPI,
# through a --system-site-packages venv. The PyPI package named "hid" is a
# DIFFERENT library with a different API that shadows the system one inside a
# venv, so it must never be declared here.
#
# Windows: there is no system package, so pip installs cython-hidapi -- whose
# PyPI name is "hidapi"; it still imports as `hid` -- for Windows only. Its
# Windows wheels cover every CPython this supports, so nothing is compiled.
#
# pyserial and cryptography (the Katana driver) are safe to declare everywhere:
# the PyPI packages ARE the libraries distributions ship as python-pyserial and
# python-cryptography. In the --system-site-packages venv the system copies
# satisfy these and pip installs nothing; elsewhere it fetches the real thing.
# pyserial 3.3 is the first with `exclusive=`; cryptography 2.0 the first with AESGCM.
dependencies = [
    "pyserial>=3.3",
    "cryptography>=2.0",
    "hidapi>=0.14; sys_platform == 'win32'",
]

[project.scripts]
ambience-rgb = "ambience_rgb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
